name: task-2-docker-web-mosalam-com

x-log-local: &log-local
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-log-json: &log-json
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: nginx:1.30.3-alpine
    container_name: task_proxy
    ports:
      - "8088:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz | grep -qx 'proxy healthy'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always
    cpus: "0.30"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *log-local

  frontend:
    build:
      context: ./frontend
    container_name: task_frontend
    networks:
      - frontend_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz | grep -qx 'frontend healthy'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *log-local

  backend-a:
    build:
      context: ./backend
    container_name: task_backend_a
    env_file: .env
    environment:
      APP_INSTANCE: backend-a
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net
      - db_net
      - monitoring_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health | grep -q '"status":"ok"'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: on-failure:5
    cpus: "0.50"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *log-json

  backend-b:
    build:
      context: ./backend
    container_name: task_backend_b
    env_file: .env
    environment:
      APP_INSTANCE: backend-b
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net
      - db_net
      - monitoring_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health | grep -q '"status":"ok"'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: on-failure:5
    cpus: "0.50"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *log-json

  mysql:
    image: mysql:8.4
    container_name: task_mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 35s
    restart: unless-stopped
    cpus: "0.80"
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging: *log-local

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.19.0
    container_name: task_mysqld_exporter
    env_file: .env
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER}"
      - "--collect.info_schema.processlist"
      - "--collect.global_status"
      - "--collect.global_variables"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db_net
      - monitoring_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9104/metrics | grep -q '^mysql_up 1$'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: 96m
    logging: *log-local

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: task_cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    cpus: "0.35"
    mem_limit: 256m
    logging: *log-local

  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: task_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
  
    networks:
      - monitoring_net
    healthcheck:
      test:
        - CMD
        - /bin/promtool
        - check
        - healthy
        - --url=http://127.0.0.1:9090
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    logging: *log-local

  grafana:
    image: grafana/grafana:13.1.0
    container_name: task_grafana
    ports:
      - "127.0.0.1:3000:3000" 
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null http://127.0.0.1:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true  
    restart: unless-stopped
    cpus: "0.40"
    mem_limit: 384m
    logging: *log-local

networks:
  frontend_net:
    name: task_frontend_net
  backend_net:
    name: task_backend_net
  db_net:
    name: task_db_net
    internal: true
  monitoring_net:
    name: task_monitoring_net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
