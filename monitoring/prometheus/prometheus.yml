global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "backend-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-a:3000", "backend-b:3000"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]
