services:
  proxy:
    image: nginx:1.30.3-alpine
    container_name: task_proxy
    ports:
      - "8088:80"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz | grep -qx 'proxy healthy'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always
    cpus: "0.30"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
